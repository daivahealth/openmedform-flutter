name: openmedform_api_client
description: >-
  Typed client for the OpenMedForm API: authentication, fetching published form
  versions, and the submission lifecycle (draft, autosave, complete, sign).
version: 0.1.0
repository: https://github.com/daivahealth/openmedform-flutter
issue_tracker: https://github.com/daivahealth/openmedform-flutter/issues
documentation: https://github.com/daivahealth/openmedform-flutter/blob/main/packages/openmedform_api_client/README.md

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  dio: ^5.11.0
  openmedform_form_core: ^0.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.31.2

# Local development resolves the sibling package from disk; pub.dev ignores
# overrides, and they are not inherited by anyone depending on this package.
dependency_overrides:
  openmedform_form_core:
    path: ../openmedform_form_core
