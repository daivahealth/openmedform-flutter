name: openmedform_flutter_renderer
description: >-
  Flutter renderer for OpenMedForm clinical form schemas. Takes a form
  definition and produces a fillable widget tree, with the same controls and
  the same value derivation as the React and Angular renderers.
version: 0.1.0
repository: https://github.com/daivahealth/openmedform-flutter
issue_tracker: https://github.com/daivahealth/openmedform-flutter/issues
documentation: https://github.com/daivahealth/openmedform-flutter/blob/main/packages/openmedform_flutter_renderer/README.md

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  openmedform_form_core: ^0.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

# Local development resolves the sibling package from disk; pub.dev ignores
# overrides, and they are not inherited by anyone depending on this package.
dependency_overrides:
  openmedform_form_core:
    path: ../openmedform_form_core
